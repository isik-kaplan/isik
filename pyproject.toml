[project]
name = "isik"
# The version lives in isik/__init__.py as __version__ - hatchling reads it from there (see
# [tool.hatch.version]), so it is written in one place and the package reports what it was released as.
dynamic = ["version"]
description = "Everyday python utilities."
authors = [
  { name = "Işık Kaplan", email = "isik.kaplan@outlook.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["utility"]
classifiers = [
  "Topic :: Software Development",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
sentry = ["sentry-sdk"]
django = ["django", "mjml-python", "django-pghistory", "django-object-actions", "dalf", "django-lifecycle", "whitenoise"]
# isik.django.drf builds on isik.django.apps (BaseModel, history tracking), so it brings the django extra.
drf = ["isik[django]", "djangorestframework", "django-filter", "drf-spectacular"]
# isik.django.celery carries pghistory context into a worker, so it brings the django extra.
celery = ["isik[django]", "celery"]
tiptap = ["prosemirror"]
templated_fields = ["jinja2"]
all = ["isik[sentry,django,drf,celery,tiptap,templated_fields]"]

[project.urls]
Homepage = "https://github.com/isik-kaplan/isik"
Repository = "https://github.com/isik-kaplan/isik"
Documentation = "https://github.com/isik-kaplan/isik"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "hypothesis>=6.130.0",
    "coverage>=7.6.0",
    "psycopg[binary]>=3.2.0",
    "pre-commit>=3.0.0",
    "ruff>=0.9.0",
    "mutmut>=3.8.0",
    "django-hosts>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "isik/__init__.py"

[tool.ruff]
line-length = 120
fix = true
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["isik"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
# The repository first: django-hosts' wheel installs a top-level `tests` package of its own, which would
# otherwise shadow this one.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["isik"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
# Every line and branch is covered, and CI's `coverage report` fails if that ever stops being true.
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mutmut]
source_paths = ["isik"]
# Run through scripts/mutation_run.py, which also mutates decorated functions - see
# scripts/mutmut_decorators.py.
do_not_mutate = ["*/migrations/*"]
pytest_add_cli_args_test_selection = ["tests"]
# --reuse-db: mutmut runs pytest many times over one session - without it, pytest-django would
# recreate the whole Postgres schema (real migrations, not --no-migrations - see django_settings.py)
# on every single one. --hypothesis-profile=mutation: see tests/conftest.py.
# -p tests.mutation_ordering: runs each mutant's tests likeliest-killer-first - see that module.
pytest_add_cli_args = ["--reuse-db", "-q", "--hypothesis-profile=mutation", "-p", "tests.mutation_ordering"]
# mutmut budgets a mutant as (estimated_time_of_tests + timeout_constant) * timeout_multiplier, and
# the estimate is summed from test durations alone. The first mutant each worker runs also builds
# that worker's database, which no duration includes - so at the default budget one mutant per
# worker read as a hang, and one of those false timeouts was hiding a real survivor. A genuinely
# non-terminating mutant now pays the whole budget before it is called one, which is the trade.
timeout_constant = 60.0
timeout_multiplier = 3.0
