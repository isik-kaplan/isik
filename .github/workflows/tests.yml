name: Tests

on:
  pull_request:
    branches:
      - master
  # Pushes to master run this through publish.yml instead, so publishing can wait on it.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os-version: [ubuntu-22.04]

    runs-on: ${{ matrix.os-version }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: isik_test

    steps:
      - uses: actions/checkout@v4

      - name: Tune Postgres for throwaway test data
        # A CI database is discarded after the job, so crash safety buys nothing - these three are the
        # difference between waiting on the disk for every commit and not. Not settable through the
        # service definition, so set on the running server and reloaded.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m
