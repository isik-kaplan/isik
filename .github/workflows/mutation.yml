name: Mutation testing

on:
  pull_request:
    branches:
      - master
  # Pushes to master run this through publish.yml instead, so publishing can wait on it.
  workflow_call:

env:
  # How many shards the run is split into - the matrix below lists one job for each, as
  # tests/test_mutation_tooling.py holds it to. Free GitHub plans run 20 jobs at once, and a push to
  # master runs the four test jobs beside these.
  MUTATION_SHARDS: 6

jobs:
  stats:
    # The map of which tests reach which function, built once: every shard needs the same one, and building it
    # runs the whole suite traced. Each shard then starts from it - see scripts/mutation_shards.py.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: isik_test

    steps:
      - uses: actions/checkout@v4

      - name: Tune Postgres for throwaway test data
        # A CI database is discarded after the job, so crash safety buys nothing - these three are the
        # difference between waiting on the disk for every commit and not. Not settable through the
        # service definition, so set on the running server and reloaded.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Build the map of tests
        run: |
          uv run python scripts/mutation_run.py --stats-only

      - name: Hand it to the shards
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-map
          # The map, and the baseline mutation_cache.refresh() checks it against - the same checkout's, so
          # every shard finds nothing changed and loads it.
          path: |
            mutants/mutmut-stats.json
            mutants/mutation-baseline.json
          if-no-files-found: error
          retention-days: 1

  mutmut:
    name: mutmut (shard ${{ matrix.shard }})
    needs: stats
    runs-on: ubuntu-22.04
    # GitHub stops a job at six hours; this leaves the steps after the run time to save what it found.
    timeout-minutes: 330
    strategy:
      # One red shard doesn't cancel the rest: every other shard's answer is still worth having.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: isik_test
      # tests/mutation_ordering.py - which test killed which mutant, this run and the last one.
      MUTATION_KILLS: ${{ github.workspace }}/mutation-kills.jsonl
      MUTATION_KILLS_PRIOR: ${{ github.workspace }}/mutation-kills-prior.jsonl

    steps:
      - uses: actions/checkout@v4

      - name: Tune Postgres for throwaway test data
        # A CI database is discarded after the job, so crash safety buys nothing - these three are the
        # difference between waiting on the disk for every commit and not. Not settable through the
        # service definition, so set on the running server and reloaded.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Start from the map of tests
        uses: actions/download-artifact@v4
        with:
          name: mutmut-map
          path: mutants

      - name: Restore the last run's killers
        # Only ever reorders each mutant's tests - a stale or missing log costs time, never a verdict.
        uses: actions/cache/restore@v4
        with:
          path: mutation-kills.jsonl
          key: mutation-kills-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-kills-${{ matrix.shard }}-

      - name: Use them as this run's prior
        run: |
          if [ -f mutation-kills.jsonl ]; then mv mutation-kills.jsonl mutation-kills-prior.jsonl; fi

      - name: Run mutation testing
        run: |
          # Every shard runs the whole suite against its share of the mutants - a share of the tests
          # would call a mutant the other share kills a survivor. See scripts/mutation_shards.py.
          uv run python scripts/mutation_run.py --shard ${{ matrix.shard }}/$MUTATION_SHARDS

      - name: Export stats
        run: |
          uv run mutmut export-cicd-stats

      - name: Save this run's killers for the next one
        # Even when a mutant survived - every recorded kill is still valid ordering data.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: mutation-kills.jsonl
          key: mutation-kills-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results-${{ matrix.shard }}
          path: mutants/mutmut-cicd-stats.json
          retention-days: 14

      # Named here rather than left for a local run: a mutant that survives on a two-core runner and
      # dies on a laptop is exactly the one nobody can reproduce by being told to go and look.
      - name: Name anything that is not a kill
        if: always()
        run: |
          # Another shard's mutants read "not checked" here - they're its to name.
          uv run mutmut results | grep -vE ': (killed|not checked)$' || true

      - name: Fail if any mutant survived
        run: |
          uv run python -c "
          import json
          stats = json.load(open('mutants/mutmut-cicd-stats.json'))
          survived = stats['survived']
          if survived:
              print(f'{survived} mutant(s) survived - the step above names them. Add a test that')
              print('kills each one, or, for one no test can tell apart, change the code so it no')
              print('longer produces it.')
              raise SystemExit(1)
          print('No mutants survived.')
          "

  union:
    # The gate: every shard ran and reported, and none left a survivor. A shard that failed fails it too, and
    # one that never reported can't pass for one that found nothing.
    needs: mutmut
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Every shard finished
        run: |
          if [ "${{ needs.mutmut.result }}" != "success" ]; then
            echo "A shard didn't pass (${{ needs.mutmut.result }}) - its job names what it left."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: mutmut-results-*
          path: shards

      - name: Every shard reported, and nothing survived
        run: |
          python3 -c "
          import json, pathlib
          reports = sorted(pathlib.Path('shards').glob('mutmut-results-*/mutmut-cicd-stats.json'))
          expected = $MUTATION_SHARDS
          if len(reports) != expected:
              raise SystemExit(f'{len(reports)} of {expected} shards reported.')
          stats = [json.loads(report.read_text()) for report in reports]
          # Each shard's total is every mutant; what it checked is its share. The shares have to be the whole -
          # a sharding that dropped some would otherwise pass over fewer, and look like a clean run.
          totals = {shard['total'] for shard in stats}
          if len(totals) != 1:
              raise SystemExit(f'The shards saw different totals: {sorted(totals)}.')
          (total,) = totals
          verdicts = ('killed', 'survived', 'no_tests', 'skipped', 'suspicious', 'timeout', 'segfault')
          checked = sum(shard[verdict] for shard in stats for verdict in verdicts)
          if checked != total or any(shard['check_was_interrupted_by_user'] for shard in stats):
              raise SystemExit(f'The shards checked {checked} of {total} mutants.')
          survived = sum(shard['survived'] for shard in stats)
          killed = sum(shard['killed'] for shard in stats)
          print(f'{expected} shards checked all {total}: {killed} killed, {survived} survived.')
          if survived:
              raise SystemExit(1)
          "
