name: Publish

on:
  push:
    branches:
      - master

# Keep this file's name: PyPI's trusted publisher is configured against "publish.yml".

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  mutation:
    uses: ./.github/workflows/mutation.yml

  publish:
    # Never publish a version that failed its tests or left a mutant alive.
    needs: [tests, mutation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Check if version changed
        id: check_version
        run: |
          LOCAL_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          PUBLISHED_VERSION=$(curl -s -f https://pypi.org/pypi/isik/json | python -c "import json, sys; print(json.load(sys.stdin).get('info', {}).get('version', ''))" || echo "")
          echo "Local version: $LOCAL_VERSION, published version: $PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          python -m build

      - name: Publish to PyPI
        if: steps.check_version.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
