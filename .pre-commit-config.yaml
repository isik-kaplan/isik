repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      # isik.__version__ follows pyproject.toml - see scripts/sync_version.py.
      - id: sync-version
        name: sync isik.__version__ with pyproject.toml
        entry: python scripts/sync_version.py
        language: python
        files: ^(pyproject\.toml|isik/__init__\.py)$
        pass_filenames: false
